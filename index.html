<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Dean, Monica &amp; Kate</title>
<meta name="description" content="An unreasonably dramatic bouquet for your pinning ceremony.">
<meta name="theme-color" content="#07060f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#f4effa; --muted:rgba(236,228,250,.66);
  --gold:#ecd7a8; --accent:#c39ef2; --accent-glow:rgba(195,158,242,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#07060f;color:var(--ink);overflow:hidden;-webkit-tap-highlight-color:transparent}
body{font-family:'Cormorant Garamond',Georgia,serif;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* gradient text: keep the clip on an element WITHOUT filters/animations (Safari-safe) */
.gt{background:linear-gradient(100deg,#d7bdf8 0%,#fff4f8 48%,#a7f6ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.glow{filter:drop-shadow(0 0 18px rgba(200,170,255,.35))}

/* ---------- atmosphere ---------- */
.sky{position:fixed;inset:0;background:
  radial-gradient(120% 80% at 50% 110%, #1b1236 0%, transparent 60%),
  radial-gradient(90% 70% at 50% 40%, #120d26 0%, #07060f 70%);}
.aurora{position:fixed;inset:-20%;pointer-events:none;filter:blur(60px);opacity:.55}
.aurora i{position:absolute;border-radius:50%;mix-blend-mode:screen;animation:drift 26s ease-in-out infinite alternate}
.aurora i:nth-child(1){width:55vmax;height:40vmax;left:5%;top:15%;background:radial-gradient(closest-side,rgba(150,95,230,.45),transparent)}
.aurora i:nth-child(2){width:50vmax;height:38vmax;right:0;top:30%;background:radial-gradient(closest-side,rgba(60,210,230,.32),transparent);animation-duration:32s;animation-delay:-8s}
.aurora i:nth-child(3){width:45vmax;height:35vmax;left:30%;bottom:0;background:radial-gradient(closest-side,rgba(240,150,190,.25),transparent);animation-duration:38s;animation-delay:-15s}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(6vw,-4vh) scale(1.15)}100%{transform:translate(-5vw,5vh) scale(.95)}}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#dust{z-index:1}
#petals{z-index:40}
.vignette{position:fixed;inset:0;pointer-events:none;z-index:45;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.6) 100%)}
.flash{position:fixed;inset:0;z-index:46;pointer-events:none;background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.95),rgba(220,200,255,.5) 30%,transparent 70%);opacity:0}
.flash.go{animation:flash 1.6s ease-out}
@keyframes flash{0%{opacity:0}12%{opacity:1}100%{opacity:0}}

.scene{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;flex-direction:column;opacity:0;visibility:hidden;transition:opacity 1.4s ease,visibility 0s 1.4s}
.scene.on{opacity:1;visibility:visible;transition:opacity 1.4s ease,visibility 0s}
.kicker{font-family:'Cinzel',serif;letter-spacing:.38em;font-size:clamp(10px,2.6vw,13px);color:var(--muted);text-transform:uppercase;padding-left:.38em;line-height:1.7}

/* ---------- intro ---------- */
#intro{gap:min(5vh,40px);padding:24px 16px;text-align:center}
.names{font-style:italic;font-size:clamp(30px,8.5vw,58px);font-weight:400;line-height:1.15}
.seal{position:relative;width:min(44vw,180px);aspect-ratio:1;border-radius:50%;cursor:pointer;display:grid;place-items:center;outline:none}
.seal::before{content:"";position:absolute;inset:-22%;border-radius:50%;background:radial-gradient(circle,rgba(220,200,255,.35),rgba(140,220,255,.12) 45%,transparent 70%);animation:breathe 3.6s ease-in-out infinite}
.seal .ring{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(255,255,255,.28);animation:spin 18s linear infinite}
.seal .ring::after{content:"";position:absolute;top:-3px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:#fff;box-shadow:0 0 10px 3px rgba(200,180,255,.9)}
.seal .ring.r2{inset:10%;border-color:rgba(160,240,255,.22);animation-duration:12s;animation-direction:reverse}
.seal .ring.r2::after{background:#bff8ff;box-shadow:0 0 10px 3px rgba(120,240,255,.9)}
.seal .core{width:46%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff,#e9dcff 35%,#a98ae0 75%,#5d3f9a);
  box-shadow:0 0 30px 8px rgba(200,170,255,.55),0 0 80px 20px rgba(140,220,255,.2);display:grid;place-items:center;animation:breathe 3.6s ease-in-out infinite;transition:transform .5s}
.seal:hover .core{transform:scale(1.08)}
.seal .core svg{width:62%;opacity:.9}
.seal.burst .core{animation:burst 1s cubic-bezier(.2,.7,.2,1) forwards}
.seal.burst .ring{animation:ringout 1s ease-out forwards}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.07);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes burst{to{transform:scale(6);opacity:0;filter:blur(8px)}}
@keyframes ringout{to{transform:scale(2.4);opacity:0}}
.hint{font-style:italic;font-size:clamp(16px,4.2vw,20px);color:var(--ink);opacity:.8;animation:fadepulse 2.8s ease-in-out infinite}
.fine{font-family:'Cinzel',serif;font-size:clamp(9px,2.3vw,11px);letter-spacing:.28em;text-transform:uppercase;color:var(--muted);opacity:.7;margin-top:-18px;padding-left:.28em}
@keyframes fadepulse{0%,100%{opacity:.5}50%{opacity:1}}

/* ---------- typography ---------- */
#type{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;pointer-events:none;padding:0 16px}
.line{position:absolute;left:16px;right:16px;margin:auto;max-width:820px;text-align:center;font-style:italic;font-weight:400;
  font-size:clamp(30px,8vw,64px);line-height:1.15;text-shadow:0 0 24px rgba(180,150,255,.35)}
.line .w{display:inline-block;white-space:nowrap}
.line .ch{display:inline-block;opacity:0;filter:blur(14px);transform:translateY(.35em) scale(1.08);animation:chIn 1.1s cubic-bezier(.2,.65,.2,1) forwards;animation-delay:var(--d)}
.line em .ch{color:#e6d4ff;text-shadow:0 0 14px rgba(190,150,255,.95),0 0 34px rgba(120,230,255,.45)}
.line.out{animation:lineOut .9s ease-in forwards}
@keyframes chIn{to{opacity:1;filter:blur(0);transform:none}}
@keyframes lineOut{to{opacity:0;filter:blur(16px);transform:translateY(-.3em) scale(.98);letter-spacing:.06em}}

/* ---------- damage report ---------- */
#stats{z-index:25;padding:24px 16px;gap:10px;text-align:center}
.st-title{font-family:'Cinzel',serif;font-weight:400;font-size:clamp(28px,8vw,52px);letter-spacing:.12em;padding-left:.12em;line-height:1.1}
.st-sub{font-style:italic;color:var(--muted);font-size:clamp(15px,4vw,19px);margin-bottom:min(3vh,22px)}
.st-list{list-style:none;width:min(92vw,520px);display:flex;flex-direction:column;gap:min(1.8vh,14px)}
.st-row{display:flex;align-items:baseline;gap:10px;text-align:left;opacity:0;transform:translateY(10px);filter:blur(6px);transition:opacity .9s,transform .9s,filter .9s}
.st-row.on{opacity:1;transform:none;filter:none}
.st-label{font-size:clamp(15px,4.1vw,20px);flex:0 1 auto}
.st-dots{flex:1 1 20px;border-bottom:1px dotted rgba(255,255,255,.25);transform:translateY(-4px);min-width:16px}
.st-val{font-family:'Cinzel',serif;font-size:clamp(12px,3.3vw,15px);letter-spacing:.08em;color:#d9c4ff;text-align:right;flex:0 0 auto;max-width:48%;text-shadow:0 0 10px rgba(190,150,255,.6)}
.st-stamp{margin-top:min(3vh,24px);font-family:'Cinzel',serif;letter-spacing:.3em;font-size:clamp(11px,3vw,14px);color:#ff8fa8;border:1.5px solid #ff8fa8;padding:8px 14px 8px 18px;border-radius:3px;transform:rotate(-6deg) scale(2.2);opacity:0;transition:transform .45s cubic-bezier(.3,1.6,.5,1),opacity .3s;text-shadow:0 0 10px rgba(255,120,150,.5);box-shadow:0 0 18px rgba(255,120,150,.25)}
.st-stamp.on{transform:rotate(-6deg) scale(1);opacity:.95}

/* ---------- bouquet ---------- */
#bouquetScene{overflow:hidden}
#bq{position:relative;transform-origin:0 0;will-change:transform;transition:transform 1.9s cubic-bezier(.65,0,.25,1),filter 1.2s ease}
#bq.focus{filter:blur(6px) brightness(.45) saturate(1.2)}
#bq.soft{filter:blur(2px) brightness(.55) saturate(1.15)}
#bouquet{display:block;width:min(94vw,calc(90vh * .8));height:auto;overflow:visible}
@supports (height:1dvh){#bouquet{width:min(94vw,calc(90dvh * .8))}}
.cluster{transform-box:fill-box;transform-origin:50% 90%;opacity:0;transform:scale(.55) translateY(30px);transition:opacity 2s ease,transform 2.6s cubic-bezier(.2,.8,.2,1)}
.bloomed .cluster{opacity:1;transform:none}
.bloomed #c-dean{transition-delay:.2s}
.bloomed #c-monica{transition-delay:.7s}
.bloomed #c-kate{transition-delay:1.2s}
.bloomed .extras{opacity:1}
.extras{opacity:0;transition:opacity 2.5s ease 1.4s}
.wrapper-g{opacity:0;transform-box:fill-box;transform-origin:50% 100%;transform:translateY(40px);transition:opacity 1.6s ease,transform 2s cubic-bezier(.2,.8,.2,1)}
.bloomed .wrapper-g{opacity:1;transform:none}
#bq[data-focus] .cluster{transition:opacity 1.2s ease,transform 1.2s}
#bq[data-focus="dean"] .cluster:not(#c-dean),#bq[data-focus="monica"] .cluster:not(#c-monica),#bq[data-focus="kate"] .cluster:not(#c-kate){opacity:.3}
.aura{opacity:.55;animation:auraPulse 5s ease-in-out infinite}
@keyframes auraPulse{50%{opacity:.85}}
.twinkle{animation:twinkle 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}
.bq-caption{position:fixed;left:0;right:0;bottom:max(4vh,18px);text-align:center;opacity:0;transition:opacity 1.2s;padding:0 16px}
.bq-caption.on{opacity:1}

/* ---------- showcase ---------- */
#show{z-index:20;justify-content:center;gap:min(1.7vh,14px);padding:max(2.5vh,14px) 16px;text-align:center}
.sc-head{display:flex;flex-direction:column;align-items:center;gap:4px}
.sc-flower{font-family:'Cinzel',serif;letter-spacing:.36em;text-transform:uppercase;font-size:clamp(10px,2.6vw,12.5px);color:var(--accent);padding-left:.36em;text-shadow:0 0 12px var(--accent-glow)}
.sc-name-wrap{filter:drop-shadow(0 0 22px var(--accent-glow))}
.sc-name{font-family:'Cinzel',serif;font-weight:400;font-size:clamp(40px,11.5vw,80px);letter-spacing:.14em;line-height:1;padding-left:.14em;
  background:linear-gradient(180deg,#fff 10%,var(--accent) 120%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.sc-meaning{font-style:italic;font-size:clamp(14px,3.8vw,18px);color:var(--muted)}
.portal-wrap{position:relative;padding:10px}
.portal{position:relative;width:min(64vw,calc(40vh * .64),340px);aspect-ratio:9/14;border-radius:999px 999px 26px 26px;overflow:hidden;
  box-shadow:0 0 0 1px rgba(255,255,255,.35),0 0 40px 6px var(--accent-glow),0 0 120px 30px var(--accent-glow);background:#0b0918;isolation:isolate}
@supports (height:1dvh){.portal{width:min(64vw,calc(40dvh * .64),340px)}}
.portal video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.portal::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 0 0 40px 6px rgba(0,0,0,.45),inset 0 0 0 6px rgba(255,255,255,.06)}
.portal-frame{position:absolute;inset:0;border-radius:999px 999px 34px 34px;border:1px solid rgba(255,255,255,.25);pointer-events:none}
.snd{position:absolute;z-index:2;left:50%;bottom:14px;transform:translateX(-50%);font-family:'Cinzel',serif;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;
  padding:8px 14px;border-radius:99px;background:rgba(10,8,22,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.25);white-space:nowrap}
.sticker{position:absolute;z-index:3;top:18%;right:-14px;font-family:'Cinzel',serif;font-weight:600;font-size:clamp(10px,2.8vw,12.5px);letter-spacing:.12em;white-space:nowrap;
  padding:7px 12px 7px 13px;border-radius:6px;color:#14101f;background:linear-gradient(135deg,#fff,var(--accent));box-shadow:0 4px 14px rgba(0,0,0,.45),0 0 18px var(--accent-glow);
  transform:rotate(9deg) scale(0);transition:transform .6s cubic-bezier(.3,1.7,.5,1)}
#show.open .sticker{transform:rotate(9deg) scale(1);transition-delay:1.9s;animation:wobble 3.2s ease-in-out 2.6s infinite}
@keyframes wobble{0%,100%{transform:rotate(9deg) scale(1)}50%{transform:rotate(5deg) scale(1.05)}}
.sc-line{max-width:min(92vw,540px);font-style:italic;font-size:clamp(17px,4.6vw,25px);line-height:1.28}
.award{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 18px 9px;border:1px solid rgba(236,215,168,.5);border-radius:3px;background:linear-gradient(180deg,rgba(236,215,168,.09),rgba(236,215,168,.02));box-shadow:0 0 22px rgba(236,215,168,.12),inset 0 0 0 3px rgba(7,6,15,.6),inset 0 0 0 4px rgba(236,215,168,.25);max-width:min(92vw,460px)}
.award small{font-family:'Cinzel',serif;font-size:9.5px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);padding-left:.32em}
.award span{font-style:italic;font-size:clamp(14px,3.9vw,18px);color:#f7ecd2;line-height:1.25}
#show .sc-head,#show .sc-line,#show .award,#show .next{opacity:0;transform:translateY(12px);filter:blur(8px);transition:opacity 1s ease,transform 1s ease,filter 1s ease}
#show .portal-wrap{opacity:0;transform:scale(.35);filter:blur(18px);clip-path:circle(0% at 50% 70%);transition:opacity 1.2s ease,transform 1.6s cubic-bezier(.2,.8,.2,1),filter 1.4s ease,clip-path 1.6s cubic-bezier(.3,.7,.2,1)}
#show.open .sc-head{opacity:1;transform:none;filter:none;transition-delay:.15s}
#show.open .portal-wrap{opacity:1;transform:none;filter:none;clip-path:circle(120% at 50% 70%)}
#show.open .sc-line{opacity:1;transform:none;filter:none;transition-delay:1.1s}
#show.open .award{opacity:1;transform:none;filter:none;transition-delay:2.6s}
#show.open .next{opacity:1;transform:none;filter:none;transition-delay:3.2s}
.next{position:relative;font-family:'Cinzel',serif;letter-spacing:.32em;text-transform:uppercase;font-size:11.5px;color:var(--muted);padding:8px 4px 12px 8px}
.next .bar{position:absolute;left:0;right:0;bottom:4px;height:1px;background:rgba(255,255,255,.15);overflow:hidden}
.next .bar::after{content:"";position:absolute;inset:0;background:var(--accent);transform-origin:left;transform:scaleX(var(--p,0));box-shadow:0 0 8px var(--accent)}

/* ---------- pin ceremony ---------- */
#pins,#finale{background:radial-gradient(ellipse at center,rgba(7,6,15,.78),rgba(7,6,15,.4) 75%)}
#pins{z-index:26;gap:min(4vh,30px);padding:24px 16px;text-align:center}
.pin-title{font-style:italic;font-size:clamp(34px,9.5vw,64px);line-height:1.1}
.pin-hint{font-style:italic;color:var(--muted);font-size:clamp(15px,4vw,19px);margin-top:-8px}
.pin-row{display:flex;gap:min(5vw,40px);justify-content:center;align-items:flex-start;width:100%}
.pin{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;width:min(27vw,140px);outline:none}
.pin svg{width:100%;height:auto;display:block;filter:drop-shadow(0 6px 14px rgba(0,0,0,.5));transition:transform .5s cubic-bezier(.3,1.5,.5,1),filter .6s;animation:hover 3.4s ease-in-out infinite}
.pin:nth-child(2) svg{animation-delay:-1.1s}.pin:nth-child(3) svg{animation-delay:-2.2s}
@keyframes hover{50%{transform:translateY(-6px)}}
.pin:hover svg{transform:scale(1.06)}
.pin-name{font-family:'Cinzel',serif;letter-spacing:.2em;font-size:clamp(11px,3vw,14px);padding-left:.2em}
.pin-jab{font-style:italic;font-size:clamp(12px,3.3vw,15px);color:var(--muted);min-height:2.6em;line-height:1.25;opacity:0;transition:opacity .8s .3s}
.pin-stamp{position:absolute;top:30%;left:50%;font-family:'Cinzel',serif;font-weight:600;font-size:clamp(10px,2.8vw,13px);letter-spacing:.22em;color:var(--gold);border:1.5px solid var(--gold);padding:4px 6px 4px 9px;border-radius:2px;
  background:rgba(7,6,15,.75);transform:translate(-50%,-50%) rotate(-14deg) scale(2.4);opacity:0;pointer-events:none;transition:transform .4s cubic-bezier(.3,1.6,.5,1),opacity .25s;white-space:nowrap;box-shadow:0 0 16px rgba(236,215,168,.35)}
.pin.done svg{filter:drop-shadow(0 0 22px var(--c)) drop-shadow(0 6px 14px rgba(0,0,0,.5));animation:none;transform:scale(1.04)}
.pin.done .pin-stamp{transform:translate(-50%,-50%) rotate(-14deg) scale(1);opacity:1}
.pin.done .pin-jab{opacity:1}

/* ---------- finale ---------- */
#finale{z-index:35;gap:14px;text-align:center;padding:24px 16px}
.fin-title{font-style:italic;font-size:clamp(32px,9vw,62px);line-height:1.1;max-width:min(92vw,760px)}
.fin-sub{font-style:italic;font-size:clamp(17px,4.6vw,23px);color:var(--muted);max-width:min(90vw,520px);line-height:1.3}
.fin-sign{font-family:'Pinyon Script',cursive;font-size:clamp(34px,9vw,50px);color:var(--gold);text-shadow:0 0 18px rgba(236,215,168,.35)}
.prophecy{width:min(90vw,460px);min-height:110px;padding:16px 18px;border:1px solid rgba(255,255,255,.14);border-radius:14px;background:rgba(255,255,255,.035);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.prophecy small{font-family:'Cinzel',serif;letter-spacing:.3em;font-size:9.5px;text-transform:uppercase;color:var(--gold);padding-left:.3em}
.prophecy p{font-style:italic;font-size:clamp(16px,4.3vw,20px);line-height:1.3;transition:opacity .45s,filter .45s}
.prophecy p.swap{opacity:0;filter:blur(6px)}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{font-family:'Cinzel',serif;letter-spacing:.24em;text-transform:uppercase;font-size:11px;padding:12px 18px 12px 22px;border-radius:99px;border:1px solid rgba(255,255,255,.25);color:var(--ink);transition:background .4s,border-color .4s}
.btn:hover{background:rgba(255,255,255,.08)}
.btn.gold{border-color:rgba(236,215,168,.6);color:var(--gold)}
#finale > *{opacity:0;transform:translateY(14px);filter:blur(10px);transition:opacity 1.4s ease,transform 1.4s ease,filter 1.4s ease}
#finale.on > *{opacity:1;transform:none;filter:none}
#finale.on > :nth-child(2){transition-delay:.5s}
#finale.on > :nth-child(3){transition-delay:1.3s}
#finale.on > :nth-child(4){transition-delay:2.1s}
#finale.on > :nth-child(5){transition-delay:3s}
#finale.on > :nth-child(6){transition-delay:3.6s}

#mute{position:fixed;z-index:60;top:max(12px,env(safe-area-inset-top));right:14px;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(10,8,22,.4);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;place-items:center;color:var(--muted)}
#mute.show{display:grid}
#mute svg{width:18px;height:18px}
#mute.off .on-i,#mute:not(.off) .off-i{display:none}
.pool{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;overflow:hidden;left:-10px;top:-10px}
@media (max-height:560px){.fine{display:none}#show .award{padding:6px 14px}}
@media (prefers-reduced-motion:reduce){.aurora i{animation:none}}
</style>
</head>
<body>
<div class="sky"></div>
<div class="aurora"><i></i><i></i><i></i></div>
<canvas id="dust"></canvas>

<!-- 1. Intro -->
<section id="intro" class="scene on">
  <div class="kicker" id="introKicker"></div>
  <div class="glow"><div class="names gt" id="introNames"></div></div>
  <div class="seal" id="seal" role="button" tabindex="0" aria-label="Open your gift">
    <span class="ring"></span><span class="ring r2"></span>
    <span class="core"><svg viewBox="-50 -50 100 100" aria-hidden="true"><g fill="#fff" fill-opacity=".9">

/* ---------------- typography ---------------- */
const typeEl = $('#type');
function renderLine(text) {
  const d = document.createElement('div'); d.className = 'line';
  let i = 0;
  text.split('*').forEach((seg, si) => {
    const host = si % 2 ? d.appendChild(document.createElement('em')) : d;
    seg.split(/(\s+)/).forEach(tok => {
      if (!tok) return;
      if (/^\s+$/.test(tok)) { host.appendChild(document.createTextNode(' ')); return; }
      const w = document.createElement('span'); w.className = 'w';
      for (const c of tok) { const s = document.createElement('span'); s.className = 'ch'; s.textContent = c; s.style.setProperty('--d', (i++ * 30) + 'ms'); w.appendChild(s); }
      host.appendChild(w);
    });
  });
  d._len = i; return d;
}
async function typeLines(lines, hold = 1300) {
  for (const t of lines) {
    const d = renderLine(t); typeEl.appendChild(d);
    await sleep(d._len * 30 + 1000 + hold);
    d.classList.add('out'); await sleep(750); d.remove();
  }
}

function loopSegment(v, s, e) {
  let alive = true;
  const tick = () => {
    if (!alive) return;
    if (v.currentTime >= e - .03 || v.currentTime < s - .05) { v.currentTime = s; }
    if (v.paused) v.play().catch(() => {});
    requestAnimationFrame(tick);
  };
  try { v.currentTime = s; } catch (err) {}
  v.play().catch(() => {});
  requestAnimationFrame(tick);
  return () => { alive = false; v.pause(); };
}

/* ---------------- zoom ---------------- */
const bq = $('#bq');
function zoomTo(key) {
  // Uses layout geometry only, so a running transition can't skew the math.
  const L = bq.offsetLeft, T = bq.offsetTop, k = bq.offsetWidth / 1000;
  const bb = document.getElementById('c-' + key).getBBox();
  const rw = bb.width * k, rh = bb.height * k;
  const s = Math.min(3, W() * .95 / rw, H() * .75 / rh);
  const lx = (bb.x + bb.width / 2) * k, ly = (bb.y + bb.height / 2) * k;
  bq.style.transform = `translate(${W() / 2 - L - s * lx}px,${H() * .5 - T - s * ly}px) scale(${s})`;
}
function zoomOut() { bq.style.transform = 'translate(0px,0px) scale(1)'; }
addEventListener('resize', () => { if (bq.dataset.focus) zoomTo(bq.dataset.focus); });

const setScene = (id, on) => $(id).classList.toggle('on', on);

  currentVid.muted = !currentVid.muted;
  if (!currentVid.muted) currentVid.play().catch(() => {});
  sndBtn.textContent = currentVid.muted ? 'tap for sound' : 'sound on';
  Sound.duck(currentVid.muted ? .55 : .12);
});
function waitOrNext(ms) {
  return new Promise(res => {
    const t0 = performance.now(); let raf;
    const bar = nextBtn.querySelector('.bar');
    const step = () => { const p = Math.min(1, (performance.now() - t0) / ms); bar.style.setProperty('--p', p); if (p >= 1) done(); else raf = requestAnimationFrame(step); };
    function done() { cancelAnimationFrame(raf); nextBtn.onclick = null; res(); }
    nextBtn.onclick = done; raf = requestAnimationFrame(step);
  });
}

    const r = rows[i], cfg = CONFIG.damage.rows[i], val = r.querySelector('.st-val');
    r.classList.add('on'); Sound.tick();
    if (cfg.count != null) {
      const t0 = performance.now(), dur = 1300;
      await new Promise(res => {
        const step = () => {
          const p = Math.min(1, (performance.now() - t0) / dur), e = 1 - Math.pow(1 - p, 3);
          val.textContent = (cfg.prefix || '') + Math.round(cfg.count * e).toLocaleString() + (p >= 1 ? (cfg.suffix || '') : '');
          p >= 1 ? res() : requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
      });
      await sleep(700);
    } else await sleep(1500);
  }
  await sleep(400);
  $('#stStamp').classList.add('on'); Sound.thud();

function pinCeremony() {
  return new Promise(res => {
    const btns = [...pinRow.children]; let left = btns.length;
    btns.forEach(b => {
      b.classList.remove('done');
      b.onclick = () => {
        if (b.classList.contains('done')) return;
        b.classList.add('done'); Sound.thud(); setTimeout(() => Sound.sparkle(), 120);
        const r = b.querySelector('svg').getBoundingClientRect();
        burstAt(r.left + r.width / 2, r.top + r.height / 2, 46, PIN_STYLE[b.dataset.key].pal);
        if (--left === 0) setTimeout(res, 2200);
      };
    });
    setScene('#pins', true);
  });
}

/* ---------------- prophecy ---------------- */
let deck = [];
function drawProphecy() {
  if (!deck.length) deck = CONFIG.prophecies.map((_, i) => i).sort(() => Math.random() - .5);
  const p = $('#prophecy'); p.classList.add('swap');
  setTimeout(() => { p.textContent = CONFIG.prophecies[deck.pop()]; p.classList.remove('swap'); }, 350);
}
$('#drawBtn').addEventListener('click', () => { drawProphecy(); Sound.chime([88, 91, 96], .08, .04); });

/* ---------------- main flow ---------------- */
let running = false;
async function run() {
  if (running) return; running = true;
  const fast = location.hash === '#fast';
  $('#seal').classList.add('burst');
  const fl = $('#flash'); fl.classList.remove('go'); void fl.offsetWidth; fl.classList.add('go');
  Sound.start(); Sound.sparkle(); muteBtn.classList.add('show');
  Object.values(vids).forEach(v => { const pr = v.play(); if (pr) pr.then(() => v.pause()).catch(() => {}); });
  petalStorm(190, true); petalRate = .12;
  await sleep(700); setScene('#intro', false);
  await sleep(1500); petalRate = .04;

  if (!fast) await typeLines(CONFIG.openingLines);
  petalRate = .02;
  if (!fast) await damageReport();

  setScene('#bouquetScene', true);
  await sleep(300); $('#bouquet').classList.add('bloomed'); Sound.chime([60, 67, 72, 76, 79], .22, .05);
  petalRate = .03;
  await sleep(1800); $('#bqCaption').classList.add('on');
  await sleep(3400); $('#bqCaption').classList.remove('on');
  await sleep(900);

  for (const p of CONFIG.people) await showcase(p);

  // pin ceremony over a softened bouquet
  document.documentElement.style.setProperty('--accent', '#ecd7a8');
  bq.style.transition = 'transform 2s ease, filter 1.6s ease'; bq.classList.add('soft');
  petalRate = .02;
  await sleep(800);
  await pinCeremony();
  setScene('#pins', false);
  await sleep(1000);
  await typeLines(CONFIG.pins.after, 1400);

  // finale
  Sound.chime([60, 64, 67, 72, 76, 79, 84], .14, .06);
  petalStorm(140); petalRate = .1;
  await typeLines(CONFIG.finaleLines, 1300);
  drawProphecy();
  setScene('#finale', true); petalRate = .05; Sound.sparkle();
  running = false;
}

function replay() {
  if (running) return;
  setScene('#finale', false);
  bq.classList.remove('focus', 'soft'); bq.style.transition = ''; zoomOut();
  $('#bouquet').classList.remove('bloomed'); setScene('#bouquetScene', false);
  setTimeout(() => { $('#seal').classList.remove('burst'); setScene('#intro', true); petalRate = 0; }, 1200);
}
$('#seal').addEventListener('click', run);
$('#seal').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); run(); } });
$('#replay').addEventListener('click', replay);
})();
</script>
</body>
